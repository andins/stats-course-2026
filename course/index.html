<title>Statistics Course for Life Scientists / Curso de estadística para científicos de la vida</title>
<style>
:root{--bg:#ffffff; --card:#f6f7f9; --text:#1c1f24; --muted:#5b6370; --accent:#2563eb; --border:#e3e6ea;}
@media (prefers-color-scheme: dark){
  :root{--bg:#14171c; --card:#1b1f26; --text:#e7e9ec; --muted:#9aa4b2; --accent:#7aa2ff; --border:#2b313b;}
}
*{box-sizing:border-box;}
body{margin:0; min-height:100vh; display:grid; place-items:center; padding:1.5rem;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.5;}
main{width:100%; max-width:34rem;}
h1{font-size:1.4rem; margin:0 0 1.2rem;}
ul{list-style:none; margin:0; padding:0; display:grid; gap:.8rem;}
a{display:flex; align-items:center; gap:.9rem; padding:1rem 1.2rem; text-decoration:none; color:var(--text);
  background:var(--card); border:1px solid var(--border); border-radius:10px;}
a:hover,a:focus-visible{border-color:var(--accent);}
a svg{height:1.6rem; width:auto; flex:none; border-radius:3px; box-shadow:0 0 0 1px rgba(128,128,128,.4);}
a strong{display:block;}
a span{color:var(--muted); font-size:.95rem;}
</style>
</head>
